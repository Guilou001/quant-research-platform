notes: Étude 008. Le mécanisme invoqué est une prime de risque qui varie dans le temps,
  dont le portage est la partie observable. La contrainte institutionnelle est le
  retrait du capital d'arbitrage quand la liquidité mondiale se dégrade, ce que mesure
  le comportement en crise. Le verdict est déduit par quantlab.reporting.study.decide_verdict.
