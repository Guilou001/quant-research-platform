name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Aucun test de l'intégration continue ne sort sur le réseau : une source
  # tierce indisponible ferait échouer une CI qui ne teste pas notre code.
  QUANTLAB_LOG_LEVEL: WARNING

jobs:
  qualite:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --all-extras --dev

      - name: Format et lint (ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Tests unitaires, propriétés et anti-biais
        run: uv run pytest -m "not network" --cov --cov-report=term-missing --cov-fail-under=85

      - name: Tests d'intégration légers
        run: uv run pytest tests/integration -m "not network"

  documentation:
    name: Construction de la documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Installer les dépendances de documentation
        run: uv sync --extra docs
      - name: Construire le site
        run: uv run mkdocs build --strict
