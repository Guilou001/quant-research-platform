# Les grands fonds fermés, ceux dont on ne peut acheter ni la part ni la série.
#
# Aucun d'eux ne publie de rendement mensuel. Ce registre porte ce que la presse
# ou un livre a RAPPORTÉ, année par année, avec la source de chaque valeur et le
# degré de vérification atteint le jour de la consultation. Trois degrés :
#   page      la valeur a été lue sur la page citée, ou dans le PDF cité ;
#   titre     la valeur figure dans le titre d'un article dont le corps n'a pas
#             pu être lu (page payante ou refusée) ;
#   resume    la valeur vient d'un résumé de moteur de recherche qui cite la
#             source, sans que la page ait été lue. C'est le degré le plus faible.
# Une année absente est une année NON TROUVÉE, jamais une année à zéro. Quand
# deux sources se contredisent, les deux chiffres sont écrits en note.
#
# Tous les rendements sont NETS de frais, en pour cent, sauf mention contraire.
# Statut de tout chiffre de ce fichier : rapporté. Consultation : 2026-09-02.

consulted: "2026-09-02"

