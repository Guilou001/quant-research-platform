# Les fonds réels, un ou deux par famille de stratégie, qui vendent au public ce
# que le laboratoire reconstruit. Ils servent de repère de TRAJECTOIRE : si notre
# reconstruction et le fonds bougent ensemble, nous captons le même phénomène.
#
# Trois choses à savoir avant de comparer. Les fonds sont NETS de frais, nos
# reconstructions sont BRUTES : l'alpha du fonds sur la stratégie porte donc les
# frais avec le signe moins. Les fonds de facteurs datent presque tous de 2013,
# donc la comparaison porte sur une dizaine d'années, après publication des
# articles. Et un fonds ne publie ni son levier ni son univers exact : une
# corrélation élevée prouve une parenté, pas une identité.
#
# Dates de première cotation MESURÉES sur Yahoo le 2026-09-02.

funds:
