hypothesis: La valeur et le momentum sont négativement corrélés dans chacun des onze
  regroupements publiés par AQR. Leur mélange à parts égales porte un ratio de Sharpe
  supérieur à celui de chacune de ses deux jambes. Ce gain survit hors de l'échantillon
  de l'article et à un coût de rotation de dix points de base.
name: 003_value_and_momentum
paper: Asness, C. S., Moskowitz, T. J. et Pedersen, L. H. (2013). Value and Momentum
  Everywhere. The Journal of Finance, 68(3), 929-985. Chiffres cibles lus dans la
  version publiée, table I, colonne « facteur ».
