# Aucun nombre qui décide de quelque chose ne vit ailleurs que dans ce fichier,
# règle 13 du CLAUDE.md. Les seuils du verdict y sont aussi, écrits avant que les
# résultats existent, parce qu'un seuil fixé après coup n'est plus un seuil.

name: 002_cross_sectional_momentum
hypothesis: >-
  Acheter le décile des titres au plus fort rendement passé et vendre celui au
  plus faible rendement passé rapporte un écart positif, et cet écart survit à sa
  publication en 1993.
paper: >-
  Jegadeesh, N. et Titman, S. (1993). Returns to buying winners and selling
  losers: implications for stock market efficiency. The Journal of Finance,
  48(1), 65-91. doi:10.1111/j.1540-6261.1993.tb04702.x
seed: 20260902

# Les deux dates que l'étude 014 lit : la fin de l'échantillon de l'article et
# le dernier jour du mois de son numéro de revue (The Journal of Finance 48(1), mars 1993), tels que la fiche
# de littérature les donne. Les coupures de validation ci-dessous sont un autre
# objet, celui de l'étude elle-même.
paper_sample_end: "1989-12-31"
publication_date: "1993-03-31"

