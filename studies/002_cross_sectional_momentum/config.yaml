      tolerance: 0.30
      kind: relative
      source: "Table III, stratégie 6 sur 6, tous titres, page 79"
    t_de_fevrier_a_decembre:
      published: 6.67
      tolerance: 0.30
      kind: relative
      source: "Table III, stratégie 6 sur 6, tous titres, page 79"
    part_de_mois_positifs:
