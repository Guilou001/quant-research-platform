# Étude 007, arbitrage statistique.
# Validée par quantlab.core.config.ExperimentConfig. Aucune constante de
# l'étude ne vit ailleurs que dans ce fichier, règle 13 du CLAUDE.md.
# Les seuils du verdict sont écrits AVANT la première exécution.

name: 007_statistical_arbitrage
hypothesis: >-
  Le résidu d'une action face aux composantes principales de la matrice de
  corrélation de son univers revient à sa moyenne, et un signal tout ou rien
  sur ce résidu rapporte plus que le coût de la rotation qu'il exige.
paper: >-
  Avellaneda, M. et Lee, J.-H. (2010). Statistical Arbitrage in the US Equities
  Market. Quantitative Finance 10(7), 761-782. Chiffres cibles lus dans le
  fac-similé de l'article publié, fiche docs/literature/avellaneda_lee_2010.md.
seed: 20260902

