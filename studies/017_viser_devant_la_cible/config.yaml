# Étude 017 : ne parcourir qu'une fraction du chemin vers la cible, sur le
# momentum de série temporelle de l'étude 001. Tout seuil écrit AVANT le résultat.

name: viser_devant_la_cible_017
hypothesis: >-
  Sur le momentum de série temporelle de l'étude 001, ne parcourir à chaque mois
  qu'une fraction du chemin vers les poids cibles, fraction choisie sur la
