# Étude 004, qualité moins camelote.
# Validée par quantlab.core.config.ExperimentConfig. Aucune constante de
# l'étude ne vit ailleurs que dans ce fichier, règle 13 du CLAUDE.md.
# Écrit AVANT le premier résultat, seuils du verdict compris.

name: 004_quality_minus_junk
hypothesis: >-
  Un portefeuille long des sociétés rentables, en croissance, sûres et
  distributrices, et court des autres, dégage un rendement excédentaire positif
  après neutralisation de la taille. Le score reconstruit depuis les
  fondamentaux publics reproduit le facteur publié par AQR.
paper: >-
  Asness, C. S., Frazzini, A. et Pedersen, L. H. (2019). Quality Minus Junk.
  Review of Accounting Studies 24(1), 34-112. Chiffres cibles lus dans la
  version de travail du 19 juin 2014, l'article publié restant inaccessible.
seed: 20260902

# Les deux dates que l'étude 014 lit : la fin de l'échantillon de l'article et
# le dernier jour du mois de son numéro de revue (Review of Accounting Studies 24(1), mars 2019), tels que la fiche
# de littérature les donne. Les coupures de validation ci-dessous sont un autre
# objet, celui de l'étude elle-même.
paper_sample_end: "2012-12-31"
publication_date: "2019-03-31"

data:
  provider: aqr
  universe:
    - USA
    - Global
    - Global Ex USA
    - Europe
    - North America
    - Pacific
  start: "1957-07-31"
  end: "2026-06-30"
  frequency: monthly
  calendar: XNYS
  price_field: total_return

# Aucun coût n'est publié par l'article, qui ne mesure ni rotation ni frais.
# Le demi-écart de dix points de base est celui retenu par l'étude 006, et il
# est balayé dans params.cost_bps_grid.
costs:
  commission_bps: 0.0
  spread_bps: 10.0
  slippage_bps: 0.0
  borrow_bps_annual: 0.0
  financing_spread_bps_annual: 0.0

risk:
  leverage_cap: 100.0
  leverage_floor: 0.0

# Le découpage suit la date de fin de l'article, décembre 2012. Tout ce qui la
# suit est un holdout final : l'article était écrit, donc aucun de ses choix ne
# pouvait s'y ajuster.
validation:
  train_end: "2006-12-31"
  validation_end: "2012-12-31"
  final_holdout_start: "2013-01-01"
  embargo_periods: 1
  purge_periods: 1
  n_folds: 8
  n_test_folds: 2

params:
  # ------------------------------------------------------------------ #
  # Jambe A, le facteur publié
  # ------------------------------------------------------------------ #
  paper_us_start: "1956-06-30"
  paper_us_end: "2012-12-31"
  paper_global_start: "1986-06-30"
  aqr_country_columns:
    - AUS
    - AUT
    - BEL
    - CAN
    - CHE
    - DEU
    - DNK
    - ESP
    - FIN
    - FRA
    - GBR
    - GRC
    - HKG
    - IRL
    - ISR
    - ITA
    - JPN
    - NLD
    - NOR
    - NZL
    - PRT
    - SGP
    - SWE
    - USA
  aqr_factor_sheets:
    market: MKT
    size: SMB
    value: HML FF
    momentum: UMD
    riskfree: RF

  # ------------------------------------------------------------------ #
  # Jambe B, notre construction depuis les jeux DERA de la SEC
  # ------------------------------------------------------------------ #
  dera_base_url: https://www.sec.gov/files/dera/data/financial-statement-data-sets
  dera_first_year: 2009
  dera_first_quarter: 2
  dera_last_year: 2026
  dera_last_quarter: 2
  dera_forms:
    - 10-K
    - 10-K/A
    - 10-Q
    - 10-Q/A

  # Le point de départ de la construction est imposé par les données : les jeux
  # DERA commencent au deuxième trimestre 2009, et six des vingt et une
  # variables demandent cinq exercices d'historique.
  construction_start: "2015-06-30"
  construction_end: "2026-06-30"
  price_start: "2009-01-01"
  execution_lag_months: 1
  growth_years: 5
  npop_years: 5

  # L'univers. Le crible par l'actif comptable borne le nombre de symboles
  # demandés à Yahoo. Il est appliqué à chaque date sur la donnée connaissable
  # ce jour-là, et l'union de ces cribles fait la liste des symboles téléchargés.
  universe_max_names: 1200
  universe_min_names: 100
  # Le crible se recalcule chaque fin de juin et gouverne les douze mois qui
  # suivent. Il est appliqué à la SECTION TRANSVERSALE, avant le passage par les
  # rangs, et non seulement à la liste des symboles téléchargés : la réunion des
  # douze cribles ferait entrer dès 2015 les sociétés qui n'ont grossi qu'après.
  universe_screen_month: 6
  universe_screen_lookback_years: 2
  min_names_per_leg: 20
  min_price_observations: 500

  # Le garde-fou de valeurs extrêmes, AJOUTÉ le 2026-09-02 après inspection de
  # trois séries de prix fautives, et déclaré comme tel dans notes.md. Aucune
  # action ordinaire ne triple plus de trois fois en un mois ni ne perd plus de
  # quatre-vingt-dix-neuf pour cent ; au-delà, la ligne décrit un raccord de
  # titres ou une erreur d'ajustement, pas un rendement.
  max_period_return: 3.0
  min_period_return: -0.99

  # La sûreté demande des rendements quotidiens.
  beta_vol_window_days: 252
  beta_corr_window_days: 1260
  beta_corr_overlap_days: 3
  beta_min_vol_days: 120
  beta_min_corr_days: 750
  beta_shrinkage_weight: 0.6
  beta_shrinkage_target: 1.0
  ivol_window_days: 252
  ivol_min_days: 120
  ivol_skip_last_day: true
  evol_min_quarters: 12
  evol_max_quarters: 60
  ohlson_cpi: 1.0

  # L'agrégation des variables en composantes, puis des composantes en score.
  # Une composante se calcule sur la moyenne de ses variables renseignées, ce
  # que l'article n'a pas besoin de faire : sa base couvre toutes les lignes.
  min_variables_per_component:
    profitability: 3
    growth: 3
    safety: 3
    payout: 2
  min_components: 3
  max_staleness_days: 548
  lag_tolerance_days: 200
  dera_cache_dir: data/raw/dera

  # Le tri. Conditionnel, la taille d'abord, la qualité ensuite, comme
  # l'article. Les valeurs de référence sont les premières de chaque grille
  # quand la grille en porte plusieurs.
  quality_quantile: 0.30
  # La borne haute vaut 0,45 et non 0,50 : à la moitié exacte, les deux
  # extrémités se rejoignent sur la médiane et se recouvrent, ce qui n'est pas
  # un tri. La correction est structurelle, pas dictée par un résultat.
  quality_quantile_grid:
    - 0.30
    - 0.10
    - 0.20
    - 0.40
    - 0.45
  size_quantile: 0.50
  size_quantile_grid:
    - 0.50
    - 0.80
  weighting: value
  weighting_grid:
    - value
    - equal
  component_names:
    - profitability
    - growth
    - safety
    - payout

  # Les grilles de robustesse, chaque case comptant pour un essai.
  execution_delays:
    - 1
    - 2
    - 3
  cost_bps_grid:
    - 0.0
    - 5.0
    - 10.0
    - 20.0
  cost_multipliers:
    - 0.0
    - 0.5
    - 1.0
    - 2.0
    - 3.0
    - 5.0
    - 10.0

  # Les sous-périodes de la jambe A, une par décennie pleine du facteur publié.
  subperiod_breakpoints:
    - "1970-12-31"
    - "1980-12-31"
    - "1990-12-31"
    - "2000-12-31"
    - "2010-12-31"
    - "2020-12-31"

  # Le repli à trois composantes, sans biais de survie, base CRSP.
  french_datasets:
    profitability: Portfolios_Formed_on_OP
    growth: Portfolios_Formed_on_INV
    safety: Portfolios_Formed_on_BETA
  french_legs:
    profitability:
      - HI 30
      - LO 30
    growth:
      - LO 30
      - HI 30
    safety:
      - LO 20
      - HI 20
  french_start: "1963-07-31"
  french_end: "2026-06-30"

  # Le rééchantillonnage par blocs.
  bootstrap_resamples: 2000
  bootstrap_block_months: 12.0

  # ------------------------------------------------------------------ #
  # Les seuils du verdict, écrits avant que le moindre résultat existe.
  # ------------------------------------------------------------------ #
  verdict:
    replication_tolerance: 0.25
    min_oos_sharpe: 0.30
    min_tstat: 3.0
    min_dsr: 0.95
    max_pbo: 0.5
    min_positive_subperiod_share: 0.6
    min_cost_multiple: 2.0
    max_portfolio_correlation: 0.6
    # Propre à cette étude : la corrélation minimale entre notre facteur
    # reconstruit et le facteur publié, au-dessous de laquelle la construction
    # n'est pas déclarée validée.
    min_construction_correlation: 0.5
