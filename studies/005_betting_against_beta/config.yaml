# La configuration de l'étude 005, validée par « quantlab.core.config.ExperimentConfig ».
#
# Aucun nombre qui décide de quelque chose ne vit ailleurs que dans ce fichier,
# règle 13 du CLAUDE.md. Les seuils du verdict sont écrits ici avant que le
# moindre résultat existe, parce qu'un seuil fixé après coup n'est plus un seuil.

name: 005_betting_against_beta
hypothesis: >-
  Un portefeuille long sur les titres à bêta faible et court sur les titres à
  bêta élevé, chaque jambe mise à l'échelle par l'inverse de son bêta ex ante,
  rapporte un rendement excédentaire positif de bêta nul. Ce rendement survit
  à une pondération plus sage que celle des rangs et au coût du levier.
paper: >-
  Frazzini, A. et Pedersen, L. H. (2014). Betting against beta. Journal of
  Financial Economics, 111(1), 1-25. doi:10.1016/j.jfineco.2013.10.005. Chiffres
  cibles lus dans la version de travail du 2013-05-10, tableaux III, IV et V.
seed: 20260902

