hypothesis: Un portefeuille long sur les titres à bêta faible et court sur les titres
  à bêta élevé, chaque jambe mise à l'échelle par l'inverse de son bêta ex ante, rapporte
  un rendement excédentaire positif de bêta nul. Ce rendement survit à une pondération
  plus sage que celle des rangs et au coût du levier.
