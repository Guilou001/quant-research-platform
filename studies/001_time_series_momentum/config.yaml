# Étude 001, momentum de série temporelle.
# Moskowitz, Ooi et Pedersen (2012), Journal of Financial Economics 104(2), 228-250.
#
# Tout nombre qui décide de quelque chose vit ici, et nulle part ailleurs.
# Les seuils du verdict sont écrits avant que les résultats existent.
name: 001_time_series_momentum
hypothesis: >-
  Le signe du rendement excédentaire des douze derniers mois d'un instrument prédit
  positivement son rendement du mois suivant, et cette prévisibilité survit à la
  publication de l'article qui l'a établie.
paper: >-
  Moskowitz, T. J., Ooi, Y. H. et Pedersen, L. H. (2012). Time series momentum.
  Journal of Financial Economics, 104(2), 228-250. doi:10.1016/j.jfineco.2011.11.003
seed: 20260902

data:
  provider: yahoo
  # Vingt-huit fonds négociés en bourse, substituts déclarés des 58 contrats à
  # terme de l'article. Dix actions, sept obligations, cinq matières premières,
  # six devises.
  universe:
    - SPY
    - QQQ
    - IWM
    - EFA
    - EEM
    - EWJ
    - EWG
    - EWU
    - EWA
    - EWC
    - TLT
    - IEF
    - SHY
    - LQD
    - HYG
    - TIP
    - AGG
    - GLD
    - SLV
    - USO
    - DBC
    - DBA
    - FXE
    - FXY
    - FXB
    - FXA
    - FXF
    - UUP
  start: "1993-01-01"
  # Dernière date des facteurs de Kenneth French au 2026-09-02, mesurée.
  end: "2026-06-30"
  frequency: daily
  calendar: XNYS
  price_field: adj_close

costs:
  # Hypothèses de coût, statut MODÉLISÉ. Aucune n'est mesurée sur des exécutions
  # réelles. Elles visent un panier de fonds cotés dont les plus étroits
  # s'échangent sous le point de base et les plus larges autour de cinq.
  commission_bps: 1.0
  spread_bps: 2.0
  slippage_bps: 1.0
  borrow_bps_annual: 0.0
  # Écart de financement au-dessus du taux sans risque, sur l'exposition brute
  # qui dépasse un. La construction de l'article porte plusieurs fois le capital.
  financing_spread_bps_annual: 50.0

risk:
  # Aucune contrainte n'est imposée au cas de base, qui reproduit l'article.
  # Le plafond de levier est déclaré à hauteur de ce que la construction produit,
  # et il est mesuré dans les résultats.
  leverage_cap: 12.0
  leverage_floor: 0.0

validation:
  # Le découpage suit l'histoire de l'article, pas un ajustement de paramètre.
  train_end: "2009-12-31"        # fin de l'échantillon de l'article
  validation_end: "2012-05-31"   # veille de la publication dans le JFE
  final_holdout_start: "2012-06-01"
  purge_periods: 12              # la fenêtre de formation, en mois
  embargo_periods: 1
  n_folds: 8
  n_test_folds: 2

params:
  # --- La construction de l'article ---
  lookback_months: 12
  holding_months: 1
  target_volatility: 0.40
  volatility_center_of_mass_days: 60
  volatility_annualization_days: 261
  volatility_min_periods_days: 252
  min_trading_days_per_month: 15
  backtest_start: "2007-01-01"

  # --- Les grilles, dont chaque cellule est un essai compté ---
  formation_grid: [1, 3, 6, 9, 12, 24, 36, 48]
  holding_grid: [1, 3, 6, 9, 12, 24, 36, 48]
  center_of_mass_grid: [20, 40, 60, 90, 120]
  max_position_grid: [3.0, 5.0]
  # Essais menés à la main hors des grilles, déclarés dans notes.md.
  manual_trials: 1

  # --- Les repères et les dates ---
  aqr_start: "1985-01-01"
  paper_sample_end: "2009-12-31"
  publication_start: "2012-06-01"
  asset_class_columns:
    TSMOM^CM: matières premières
    TSMOM^EQ: actions
    TSMOM^FI: taux
    TSMOM^FX: devises
  bond_benchmark: AGG
  commodity_benchmark: DBC

  # --- Les contrôles ---
  cost_multipliers: [0.25, 0.5, 1.0, 2.0, 3.0, 5.0, 10.0]
  plateau_neighborhood: 1
  walk_forward_train_months: 72
  walk_forward_test_months: 12
  bootstrap_resamples: 2000
  bootstrap_block_months: 6
  rolling_window_months: 36
  subperiod_breakpoints: ["2010-01-01", "2013-01-01", "2016-01-01", "2019-01-01", "2022-01-01"]
  aqr_subperiod_breakpoints:
    - "1990-01-01"
    - "1995-01-01"
    - "2000-01-01"
    - "2005-01-01"
    - "2010-01-01"
    - "2015-01-01"
    - "2020-01-01"
  tail_quantiles: [0.01, 0.05]

  # --- Les valeurs publiées, recopiées de la fiche de littérature ---
  published:
    portfolio_volatility_1985_2009: 0.12
    monthly_alpha_1985_2009: 0.0158
    monthly_alpha_tstat_1985_2009: 7.99
    umd_beta_1985_2009: 0.28
    positive_grid_cells: 62
    grid_max_tstat: 6.61
    grid_max_cell: [12, 1]

  # --- Les seuils du verdict, écrits avant les résultats ---
  verdict_criteria:
    replication_tolerance: 0.10
    min_oos_sharpe: 0.5
    min_tstat: 3.0
    min_dsr: 0.95
    max_pbo: 0.5
    min_positive_subperiod_share: 0.60
    min_cost_multiple: 2.0
    max_portfolio_correlation: 0.60
