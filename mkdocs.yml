site_name: quant-research-platform
site_description: Comprendre et vérifier les résultats de vingt et une études en finance
site_author: Guillaume Vaudescal
repo_url: https://github.com/Guilou001/quant-research-platform
edit_uri: ""
docs_dir: docs
strict: true

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair

# Les fiches de littérature sont nombreuses et indexées par literature/index.md
# plutôt qu'une par une dans la navigation.
validation:
  nav:
    omitted_files: info
  links:
    absolute_links: info
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Accueil: index.md
  - Comprendre les concepts:
      - Le parcours: guide/index.md
      - 01 La question économique: guide/01_question.md
      - 02 L'information disponible: guide/02_donnees.md
      - 03 Le calendrier du test: guide/03_calendrier.md
      - 04 Le hasard et l'incertitude: guide/04_hasard.md
      - 05 Prévoir, classer, investir: guide/05_prevoir.md
      - 06 Les coûts des positions: guide/06_couts.md
      - 07 Le portefeuille: guide/07_portefeuille.md
      - 08 Lire une conclusion: guide/08_conclusion.md
  - Explorer les études:
      - Les vingt et une études: etudes/index.md
      - Prévoir et classer les actions: etudes/011_cross_sectional_ml.md
      - Les entreprises oubliées: etudes/013_cross_sectional_ml_long.md
      - Après la publication: etudes/016_publication_decay_212.md
      - La nuit et la séance: etudes/018_nuit_contre_journee.md
      - Le portefeuille de primes: etudes/021_portefeuille_de_primes.md
  - Tableau de bord: dashboard/index.md
  - Démarrer:
      - Installation: getting_started/installation.md
      - Première étude: getting_started/premiere_etude.md
  - Architecture:
      - Vue d'ensemble: architecture/index.md
      - Décisions (ADR): architecture/adr/index.md
      - Spécifications:
          - Le gabarit: specs/TEMPLATE.md
          - 001, un univers sans biais de survie: specs/001-univers-sans-biais-de-survie.md
          - 002, Open Source Asset Pricing: specs/002-open-source-asset-pricing.md
          - 003, viser devant la cible: specs/003-viser-devant-la-cible.md
          - 004, la nuit contre la journée: specs/004-la-nuit-contre-la-journee.md
          - 005, cryptomonnaies, Coin Metrics: specs/005-cryptomonnaies-coin-metrics.md
          - 006, jeux 13F de la SEC: specs/006-jeux-13f-de-la-sec.md
          - 007, indices du Cboe et empilement: specs/007-indices-cboe-et-empilement.md
  - Feuille de route: roadmap.md
  - Méthodologie:
      - Ce qui sépare un résultat d'une coïncidence: methodology/index.md
      - Le parcours d'une stratégie: methodology/gauntlet.md
      - Formules de référence: methodology/formules.md
  - Données:
      - Le lac: data/index.md
      - Point-in-time: data/point_in_time.md
      - Biais de survie: data/survivorship_bias.md
      - Limites des données gratuites: data/free_data_limitations.md
      - Actions de société: data/corporate_actions.md
  - Analytique: analytics/index.md
  - Validation:
      - Le moteur de validation: validation/index.md
      - La réconciliation avec LEAN: validation/reconciliation_lean.md
  - Littérature: literature/index.md
  - Journal de recherche: research_journal/index.md
  - Glossaire: glossary/quant_glossary.md
